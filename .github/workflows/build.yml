name: Build REKO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "REKO_GitHub_Ready.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract REKO
        run: |
          mkdir reko
          unzip -q REKO_GitHub_Ready.zip -d reko

      - name: Build APK
        working-directory: reko
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REKO-debug-APK
          path: reko/app/build/outputs/apk/debug/*.apk
