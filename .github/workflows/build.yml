name: Build REKO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract REKO project
        shell: bash
        run: |
          rm -rf reko
          mkdir -p reko
          unzip -q "REKO_FIXED.zip" -d reko

          if [ ! -f "reko/settings.gradle.kts" ]; then
            echo "ERROR: REKO project was not found."
            find reko -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build REKO APK
        run: |
          cd reko
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload REKO APK
        uses: actions/upload-artifact@v4
        with:
          name: REKO-debug-APK
          path: reko/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
